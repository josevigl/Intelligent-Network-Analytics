[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-network-analytics"
version = "0.1.0"
description = "Reusable preprocessing and training components for telecom KPI anomaly tasks"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "iterative-stratification>=0.1.9",
]

[project.optional-dependencies]
data = ["datasets>=2.14"]
mlrun = ["mlrun"]
test = ["pytest>=7.0"]

[project.scripts]
ina-train = "pipelines.train:main"
ina-infer = "pipelines.inference:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipelines*"]
exclude = ["tests*"]
